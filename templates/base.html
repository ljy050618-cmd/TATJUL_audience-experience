<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#100d13"
    >

    <title>
        {% block title %}
        오늘의 세일럼
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{
            url_for(
                'static',
                filename='style.css'
            )
        }}"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    ></script>

    <script
        defer
        src="{{
            url_for(
                'static',
                filename='app.js'
            )
        }}"
    ></script>
</head>

<body>

    <header class="site-header">

        <a
            href="{{ url_for('index') }}"
            class="brand"
        >
            <span class="brand-symbol">
                S
            </span>

            <span>
                오늘의 세일럼
            </span>
        </a>

        <div class="header-logos">
            <span>THE CRUCIBLE</span>
            <span>탯줄</span>
        </div>

    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
