{% extends "base.html" %}

{% block title %}
입장 완료 — 오늘의 세일럼
{% endblock %}


{% block content %}

<section class="form-page welcome-page">

    <p class="eyebrow">
        WELCOME TO SALEM
    </p>

    <h1 class="page-title">
        {{ nickname }}님,<br>
        입장이 완료되었습니다.
    </h1>

    <p class="description">
        닉네임이 Supabase에 저장되었고,
        현재 브라우저의 세션에도
        참가자 정보가 연결되었습니다.
    </p>

    <div class="success-box">
        닉네임 등록 및 재접속 기능이
        정상적으로 작동하고 있습니다.
    </div>

    <p class="description">
        다음 단계에서는 이 화면 대신
        약 20문항의 검사 페이지가
        나타나도록 연결하게 됩니다.
    </p>

    <form
        method="POST"
        action="{{ url_for('logout') }}"
    >

        <button
            type="submit"
            class="secondary-button full-button"
        >
            처음 화면으로 돌아가기
        </button>

    </form>

</section>

{% endblock %}
